# MOPPO v2 (retreino justo, §2.3 do PLANO_DESENVOLVIMENTO.md v2). Herda a config v1 e muda só o que está
# registrado no DECISIONS_MO_V2.md.
base: ../configs_mo/default.yaml

mo:
