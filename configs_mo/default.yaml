# Multi-Objective PPO (AMOR) configuration inheriting from default.yaml
base: ../configs/default.yaml

mo:
  memory: true
  memory_len: 8
  objectives: 4
  alpha_dirichlet: 1.0
  scale_factors: [1.0, 1.0, 1.0, 1.0]

ppo:
  total_timesteps: 350000
  n_envs: 8
  n_steps: 256
  batch_size: 2048
  n_epochs: 5
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  features_dim: 256
  seed: 0
  checkpoints: 3

env:
  scenario: S2
  descriptor: hand
